name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "shared/**"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Tests + unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SCHEME: BelugaLive
      DERIVED: ${{ github.workspace }}/build/DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (BelugaCore)
        working-directory: ios/BelugaCore
        run: |
          xcodebuild -version
          swift test 2>&1 | tee swift-test.log | tail -n 80; CODE=${PIPESTATUS[0]}
          grep -E "AUDIOPROBE|failed|error:" swift-test.log | head -n 60 || true
          exit $CODE

      - name: Generate project
        working-directory: ios
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Build unsigned IPA
        working-directory: ios
        env:
          BELUGA_DEFAULT_HOST: ${{ secrets.BELUGA_DEFAULT_HOST }}
        run: |
          set -o pipefail
          xcodebuild build             -project BelugaLive.xcodeproj -scheme "$SCHEME"             -configuration Release -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$DERIVED"             BELUGA_DEFAULT_HOST="$BELUGA_DEFAULT_HOST"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             | grep -E "error:|warning: .*(Sendable|isolat)|BUILD" | head -n 150
          APP="$DERIVED/Build/Products/Release-iphoneos/BelugaLive.app"
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../BelugaLive-unsigned.ipa Payload)
          bash scripts/check-ipa.sh BelugaLive-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BelugaLive-unsigned
          path: ios/BelugaLive-unsigned.ipa
          if-no-files-found: error

  screenshots:
    name: Simulator screenshots
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SCHEME: BelugaLive
      DERIVED: ${{ github.workspace }}/build/DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Boot simulator (in background)
        run: bash ios/scripts/screenshots.sh --boot-only

      - name: Generate project
        working-directory: ios
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build             -project BelugaLive.xcodeproj -scheme "$SCHEME"             -configuration Debug -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             -derivedDataPath "$DERIVED"             CODE_SIGNING_ALLOWED=NO | grep -E "error:|BUILD" | head -n 150

      - name: Screenshots (mock scenes, light + dark)
        run: bash ios/scripts/screenshots.sh "$DERIVED/Build/Products/Debug-iphonesimulator/BelugaLive.app" screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Demo video (mock lesson, h264)
        run: bash ios/scripts/record-demo.sh "$DERIVED/Build/Products/Debug-iphonesimulator/BelugaLive.app" video

      - name: Tour video (chat shell transitions, light and dark)
        run: |
          APP="$DERIVED/Build/Products/Debug-iphonesimulator/BelugaLive.app"
          DEMO_NAME=tour-light DEMO_ARGS="-mock 1 -mockTour 1" VIDEO_SECONDS=44 bash ios/scripts/record-demo.sh "$APP" video
          DEMO_NAME=tour-dark DEMO_APPEARANCE=dark DEMO_ARGS="-mock 1 -mockTour 1" VIDEO_SECONDS=44 bash ios/scripts/record-demo.sh "$APP" video

      - name: Call video (call rises from the chat, lesson in the call, board up and down, hang up)
        run: |
          APP="$DERIVED/Build/Products/Debug-iphonesimulator/BelugaLive.app"
          DEMO_NAME=call DEMO_ARGS="-mock 1 -mockCall 1" VIDEO_SECONDS=40 bash ios/scripts/record-demo.sh "$APP" video

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-video
          path: video
          if-no-files-found: ignore

  uitests:
    name: UI crash hunt (simulator, software keyboard)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DERIVED: ${{ github.workspace }}/build/DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Boot simulator with the software keyboard
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          bash ios/scripts/screenshots.sh --boot-only

      - name: Generate project
        working-directory: ios
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Run the walk-through
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices booted -j | jq -r '[.devices[][] | select(.state=="Booted")][0].udid')
          xcrun simctl bootstatus "$UDID" -b
          rm -rf ~/Library/Logs/DiagnosticReports/BelugaLive* || true
          set +e
          xcodebuild test -project BelugaLive.xcodeproj -scheme BelugaLiveUITests             -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$DERIVED"             -resultBundlePath "$GITHUB_WORKSPACE/hunt.xcresult" -parallel-testing-enabled NO             CODE_SIGNING_ALLOWED=NO > "$GITHUB_WORKSPACE/hunt.log" 2>&1
          CODE=$?
          set -e
          grep -E "HUNT |error:|Test Case .*(passed|failed)|\*\* TEST" "$GITHUB_WORKSPACE/hunt.log" | tail -n 200
          mkdir -p "$GITHUB_WORKSPACE/crashes"
          cp ~/Library/Logs/DiagnosticReports/BelugaLive* "$GITHUB_WORKSPACE/crashes/" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/crashes"
          for f in "$GITHUB_WORKSPACE"/crashes/*; do [ -f "$f" ] && { echo "=== $f"; head -c 6000 "$f"; echo; }; done
          exit $CODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-hunt
          path: |
            crashes
            hunt.log
            hunt.xcresult
          if-no-files-found: ignore

