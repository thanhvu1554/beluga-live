name: BelugaLive
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: vi
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  BelugaCore:
    path: BelugaCore
targets:
  BelugaLive:
    type: application
    platform: iOS
    sources:
      - path: BelugaLive
      - path: ../shared/board
        type: folder
        buildPhase: resources
    dependencies:
      - package: BelugaCore
    postBuildScripts:
      - name: Drop web dev harness from the bundle
        basedOnDependencyAnalysis: false
        script: |
          B="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/board"
          rm -rf "$B/dev.html" "$B/dev-data.js" "$B/dev-knowledge.json" "$B/dev-files"
    settings:
      base:
        PRODUCT_NAME: BelugaLive
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
